<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Playlist Bridge</title><desc id="desc">Transfiere tus playlists públicas de Spotify a YouTube Music.</desc>
